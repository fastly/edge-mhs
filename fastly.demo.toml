# ⚠️ INSECURE LOCAL DEMO CONFIG — DO NOT DEPLOY ⚠️
#
# Runs gateway-server locally under Viceroy with authentication DISABLED, and
# both MHS backends pointed at scripts/mock_mhs_backend.py (there is no
# public MHS spec yet, so smoke testing needs a stand-in). Kept separate from
# fastly.toml (secure-by-default, auth required) so an open configuration can
# never be deployed by accident — same split edge-mcp itself uses.
#
#   viceroy --addr 127.0.0.1:7686 -C fastly.demo.toml bin/main.wasm
manifest_version = 3
name = "edge-mhs-interlock-demo"
description = "Local, unauthenticated demo of edge-mhs-interlock (do not deploy)"
language = "rust"
authors = ["austin@fastly.com"]

[scripts]
build = "cargo build --release --target wasm32-wasip1 --package gateway-server && cp target/wasm32-wasip1/release/gateway-server.wasm bin/main.wasm"

[local_server]

[local_server.kv_stores]
task_store = { file = "data/kv_tasks.json", format = "json" }
jwks_cache = { file = "data/kv_jwks.json", format = "json" }
idempotency = { file = "data/kv_idem.json", format = "json" }
device_limits_cache = { file = "data/kv_device_limits.json", format = "json" }

[local_server.secret_stores]
[[local_server.secret_stores.auth]]
key = "mrtr-aead-key-1"
env = "SECRET_MRTR_AEAD_KEY_1"

[local_server.config_stores.verifier]
format = "inline-toml"
[local_server.config_stores.verifier.contents]
# Anonymous demo mode — both flags are required, by design (VerifierConfig).
auth_required = "false"
allow_anonymous_demo = "true"
max_body_bytes = "1048576"
mhs_registry_base_url = "http://127.0.0.1:8899"
mhs_driver_base_url = "http://127.0.0.1:8899"

[local_server.backends.issuer_jwks]
url = "https://issuer.example.com"
override_host = "issuer.example.com"

[local_server.backends.mhs_registry]
url = "http://127.0.0.1:8899"

[local_server.backends.mhs_driver]
url = "http://127.0.0.1:8899"
